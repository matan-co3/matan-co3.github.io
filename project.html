<script>
  /* videos with a play button: show the first frame (a still of it) right away
     and download the video itself only once it is played */
  function PV(src) { return /^images\/(?!sl_)[\w.-]+\.mp4$/.test(src || "") ? ' preload="metadata" poster="' + src.replace(/\.mp4$/, "-poster.jpg") + '"' : ""; }
</script>
  <script src="app.js"></script>
  <script>
  /* ---- PROJECT PAGE RENDER ---- */
  (function () {
    var P = window.PORTFOLIO || {};
    var esc = window.PF.esc;
    document.querySelector(".footer__year").textContent = "© " + new Date().getFullYear();

    var id = new URLSearchParams(location.search).get("id");
    var list = P.projects || [];
    var i = id ? list.findIndex(function (p) { return p.id === id; }) : 0;
    if (i < 0) i = 0;
    var p = list[i];
    // phones: Anything to Video's banners open on the mobile web banner, then
    // the desktop one (each size keeps pointing at its own file)
    if (p && p.id === "anything-to-video" && window.matchMedia("(max-width: 720px)").matches) {
      (p.extraGuides || []).forEach(function (eg) {
        var ss = eg.className === "a2v-banner" && eg.sizeSwitch;
        if (!ss || ss._mob) return;
        ss.sizes.forEach(function (z, k) { if (z.frame == null) z.frame = k; });
        var t = ss.sizes[0]; ss.sizes[0] = ss.sizes[1]; ss.sizes[1] = t; ss._mob = true;
      });
    }
    var root = document.getElementById("project");
    if (p) document.body.setAttribute("data-project", p.id);
    // Opt-in shared-column layout: every fluid visual (single image, stack,
    // row, grid, feed) spans the exact same left/right edges as the text
    // column, with square corners and left-aligned sub-labels - the system
    // established for Waiters Protest, reusable by any project going forward.
    if (p && p.sharedColumn) document.body.classList.add("shared-column");

    if (!p) {
      root.innerHTML = '<p class="project__miss">Project not found. <a href="portfolio.html" data-nav="1">Back to all works →</a></p>';
      window.PF.initReveal();
      return;
    }

    document.title = p.title + " - Matan Cohen";

    function row(label, val) {
      return val ? '<div class="cs__meta-row"><dt>' + label + '</dt><dd>' + val + '</dd></div>' : '';
    }

    // "matchDeviceHeights": the laptop and phone sit in one grid row, so they
    // already start on the same line - this makes them end on it too, without
    // stretching either one. The laptop is left alone (its screen height comes
    // from its own aspect-ratio); the phone is scaled by width, its screen
    // taking height from an aspect-ratio in CSS, so the design inside keeps
    // its real proportions.
    //
    // The phone's rendered height is affine in its width - the screen scales,
    // the frame's own padding doesn't - so rather than assume a single ratio,
    // probe two widths once and solve for height = a·width + b. Everything
    // then comes from the stylesheet instead of numbers hard-coded here.
    //
    // One helper for every layout that pairs the two devices (lp, slides, and
    // a guide slot's lpMock), so they can't drift apart.
    function matchDevicePair(laptopEl, phoneEl) {
      if (!laptopEl || !phoneEl) return function () {};
      var phoneFit = null;
      function measurePhoneFit() {
        var prev = phoneEl.style.width;
        function heightAt(w) {
          phoneEl.style.width = w + "px";
          return phoneEl.getBoundingClientRect().height;
        }
        var h1 = heightAt(200), h2 = heightAt(400);
        phoneEl.style.width = prev;
        if (!h1 || !h2 || h2 === h1) return null;
        var a = (h2 - h1) / 200;
        return { a: a, b: h1 - a * 200 };
      }
      function sync() {
        if (!phoneFit) phoneFit = measurePhoneFit();
        if (!phoneFit) return;
        // The phone's column is content-sized, so narrowing the phone widens
        // the laptop, which changes the height the phone has to match. Each
        // pass shrinks that error, and it stops as soon as the two heights
        // agree to within half a pixel.
        for (var pass = 0; pass < 8; pass++) {
          var laptopH = laptopEl.getBoundingClientRect().height;
          if (laptopH <= 80) return;
          if (Math.abs(phoneEl.getBoundingClientRect().height - laptopH) < 0.5) break;
          var w = (laptopH - phoneFit.b) / phoneFit.a;
          if (!(w > 60)) return;
          phoneEl.style.width = w + "px";
        }
      }
      var syncRaf = null;
      window.addEventListener("resize", function () {
        if (syncRaf) cancelAnimationFrame(syncRaf);
        syncRaf = requestAnimationFrame(sync);
      });
      return sync;
    }
    var tools = (p.tools || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join("");
    var toolsRow = tools ? '<div class="cs__meta-row"><dt>Tools</dt><dd><div class="tags">' + tools + '</div></dd></div>' : '';

    var metaDl =
      '<dl class="cs__meta reveal">' +
        // Overview only fills in for a project with neither an about
        // paragraph nor its own tagline showing up in the header (e.g.
        // Waiters Protest) - a project that already shows its tagline as the
        // big line under the title (e.g. SecureOT, once its about paragraph
        // is removed) shouldn't get that same line repeated here in a small
        // meta row underneath.
        (p.about || p.tagline ? '' : row("Overview", esc(p.tagline))) +
        row("Goal", esc(p.goal)) +
        row("My role", esc(p.role)) +
        row("Challenge", esc(p.challenge)) +
        row("Decisions", esc(p.decisions)) +
        toolsRow +
        row("Outcome", esc(p.outcome)) +
      '</dl>';

    // visuals: horizontal strip (layout:"strip") or stacked column
    var allImgs = [];
    if (p.cover) allImgs.push(p.cover);
    (p.images || []).forEach(function (im) { allImgs.push(im); });

    var gifsHtml = "";
    if (p.gifs && (p.gifs.items || []).length) {
      var multiGif = p.gifs.items.length > 1;
      // "simple" gifs (currently just AI Avatar's format switcher) skip the
      // section heading entirely, show the format as a plain caption (not
      // the bold lp__label styling) right above the image, and move the
      // page count below the image - the site's usual count position -
      // instead of sharing a row with the format above it. Left as an
      // opt-in flag so the original heading+shared-row layout (veo3-guide,
      // World of Learning) stays exactly as it was.
      if (p.gifs.simple) {
        gifsHtml =
          // Optional heading above a "simple" gifs block - off by default
          // (that's the whole point of "simple"), but some projects still
          // want a section title above the format switcher without taking on
          // the rest of the non-simple layout (shared format/count row, etc).
          (p.gifs.label ? '<div class="lp__label lp__label--guide">' + esc(p.gifs.label) + '</div>' : '') +
          '<div class="carousel__format" id="gfFormat"></div>' +
          '<div class="carousel__stage carousel__stage--side" id="gfStage">' +
            (multiGif ? '<button class="carousel__arrow carousel__arrow--prev" id="gfPrev" aria-label="Previous gif">‹</button>' : '') +
            '<figure class="media--img carousel__figure"><div id="gfMedia"></div></figure>' +
            (multiGif ? '<button class="carousel__arrow carousel__arrow--next" id="gfNext" aria-label="Next gif">›</button>' : '') +
          '</div>' +
          (multiGif ? '<div class="carousel__meta" style="justify-content:flex-end"><span class="carousel__count" id="gfCount"></span></div>' : '');
      } else {
        // "countBelow": the format label stays in its usual row above the
        // stage, but the page count moves to its own row under the image,
        // right-aligned - the site's usual count position - instead of
        // sharing the top row with the format.
        var countBelowGifs = !!p.gifs.countBelow;
        gifsHtml =
          '<div class="lp__label lp__label--guide">' + esc(p.gifs.label || "GIFs") + '</div>' +
          // With the count moved below, the top row holds nothing but the
          // format - so it's a plain size line (.carousel__subtitle, the
          // small uppercase style every other format line on the site uses:
          // the sizeSwitch blocks in Scenario AI, Anything to Video and
          // Evergreen) rather than the bold 18px display type it inherited
          // from sharing a row with the page count.
          (countBelowGifs
            ? '<div class="carousel__subtitle gifs__format" id="gfFormat"></div>'
            : '<div class="carousel__meta" id="gfMeta"><span id="gfFormat"></span>' + (multiGif ? '<span class="carousel__count" id="gfCount"></span>' : '') + '</div>') +
          '<div class="carousel__stage carousel__stage--side" id="gfStage">' +
            (multiGif ? '<button class="carousel__arrow carousel__arrow--prev" id="gfPrev" aria-label="Previous gif">‹</button>' : '') +
            '<figure class="media--img carousel__figure"><div id="gfMedia"></div></figure>' +
            (multiGif ? '<button class="carousel__arrow carousel__arrow--next" id="gfNext" aria-label="Next gif">›</button>' : '') +
          '</div>' +
          (multiGif && countBelowGifs ? '<div class="carousel__meta" style="justify-content:flex-end"><span class="carousel__count" id="gfCount"></span></div>' : '');
      }
    }

    var bodyHtml;
    if (p.layout === "lp") {
      var onePagerHtml = "";
      if (p.onePager && (p.onePager.images || []).length) {
        onePagerHtml =
          '<div class="lp__label lp__label--guide">' + esc(p.onePager.label || "One pager") + '</div>' +
          '<div class="carousel__stage carousel__stage--side" id="opStage">' +
            '<button class="carousel__arrow carousel__arrow--prev" id="opPrev" aria-label="Previous page">‹</button>' +
            '<figure class="media--img carousel__figure"><img id="opImg" alt=""></figure>' +
            '<button class="carousel__arrow carousel__arrow--next" id="opNext" aria-label="Next page">›</button>' +
          '</div>' +
          '<div class="carousel__meta" style="justify-content:flex-end"><span class="carousel__count" id="opCount"></span></div>';
      }
      bodyHtml =
        '<div class="project__lead">' + metaDl + '</div>' +
        '<div class="lp__label">' + esc(p.lpHeading || "Landing page - web &amp; mobile") + '</div>' +
        '<div class="lp__grid">' +
          // Same pair of device sub-labels every laptop + phone mockup carries.
          '<div class="carousel__subtitle carousel__subtitle--web">Web</div>' +
          '<div class="carousel__subtitle carousel__subtitle--mobile">Mobile</div>' +
          '<div class="mock mock--laptop">' +
            '<div class="mock__lid"><div class="mock__cam"></div>' +
              (p.embedWeb
                ? '<div class="mock__screen mock__screen--embed" id="lpWebScreen"><iframe class="mock__embed" src="' + esc(p.embedWeb) + '" allowfullscreen loading="lazy"></iframe></div>'
                : '<div class="mock__screen" id="lpWebScreen">' +
                    (p.navWeb ? '<div class="mock__nav mock__nav--strip"><img src="' + esc(p.navWeb) + '" alt="Powtoon"></div>' : '') +
                    '<img src="' + esc(p.lpWeb) + '" alt="' + esc(p.title) + ' (web)">' +
                  '</div>') +
            '</div><div class="mock__base"></div>' +
          '</div>' +
          '<div class="mock mock--phone">' +
            '<span class="mock__btn mock__btn--silent"></span><span class="mock__btn mock__btn--vup"></span><span class="mock__btn mock__btn--vdn"></span><span class="mock__btn mock__btn--pwr"></span>' +
            '<div class="mock__island"></div>' +
            '<div class="mock__screen mock__screen--phone" id="lpMobileScreen">' +
              '<div class="mock__nav mock__nav--strip mock__nav--strip-phone"><div class="mock__statusgap"></div>' +
              (p.navMobile ? '<img src="' + esc(p.navMobile) + '" alt="Powtoon">' : '') +
              '</div>' +
              '<img src="' + esc(p.lpMobile) + '" alt="' + esc(p.title) + ' (mobile)">' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="lp__hint" id="lpHint"><span class="hint-d">Click &amp; drag to scroll</span><span class="hint-m">Scroll inside to see the full page</span></div>' +
        onePagerHtml;
    } else if (p.layout === "slides" && (p.slides || []).length) {
      var tabs = p.slides.map(function (s, ti) {
        return '<button class="ctab" data-i="' + ti + '">' + esc(s.label) + '</button>';
      }).join("");
      bodyHtml =
        '<div class="project__lead">' + metaDl + '</div>' +
        '<div class="carousel reveal" id="carousel">' +
          // A sub-heading naming what the tabs below it choose between.
          '<div class="lp__label lp__label--guide">' + esc(p.tabsHeading || "Industries") + '</div>' +
          '<div class="carousel__tabs" id="carTabs">' + tabs + '</div>' +
          '<div class="lp__grid">' +
            '<div class="carousel__subtitle carousel__subtitle--web">Web</div>' +
            '<div class="carousel__subtitle carousel__subtitle--mobile">Mobile</div>' +
            '<div class="mock mock--laptop">' +
              '<div class="mock__lid">' +
                '<div class="mock__cam"></div>' +
                '<div class="mock__screen" id="lpWebScreen">' +
                  '<div class="mock__nav mock__nav--web"><img class="mock__logo" src="images/powtoon-logo.png" alt="Powtoon"></div>' +
                  '<img class="lp__body--web" id="lpWeb" alt="">' +
                '</div>' +
              '</div>' +
              '<div class="mock__base"></div>' +
            '</div>' +
            '<div class="mock mock--phone">' +
              '<span class="mock__btn mock__btn--silent"></span>' +
              '<span class="mock__btn mock__btn--vup"></span>' +
              '<span class="mock__btn mock__btn--vdn"></span>' +
              '<span class="mock__btn mock__btn--pwr"></span>' +
              '<div class="mock__island"></div>' +
              '<div class="mock__screen mock__screen--phone" id="lpMobileScreen">' +
                '<div class="mock__nav mock__nav--strip mock__nav--strip-phone"><div class="mock__statusgap"></div><img id="lpNavMobile" alt="Powtoon"></div>' +
                '<img class="lp__body--mobile" id="lpMobile" alt="">' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="lp__hint" id="lpHint"><span class="hint-d">Click &amp; drag to scroll</span><span class="hint-m">Scroll inside to see the full page</span></div>' +
          '<div class="lp__label lp__label--guide">The guide</div>' +
          '<div class="carousel__stage">' +
            '<button class="carousel__arrow carousel__arrow--prev" id="carPrev" aria-label="Previous slide">‹</button>' +
            '<figure class="media--img carousel__figure"><img id="carImg" alt=""></figure>' +
            '<button class="carousel__arrow carousel__arrow--next" id="carNext" aria-label="Next slide">›</button>' +
          '</div>' +
          '<div class="carousel__meta"><span id="carLabel"></span><span class="carousel__count" id="carCount"></span></div>' +
        '</div>';
    } else if (p.layout === "guide" && (p.guide || p.guide2 || p.guide3 || p.guide4 || p.guide5)) {
      function guideSectionHtml(g, stageId, prevId, nextId, imgId, countId) {
        if (!g || (!g.count && !g.lpMock && !g.video)) return "";
        var multi = g.count > 1;
        // A guide can optionally carry a shared "groupLabel" (a big heading
        // rendered once above a set of related carousels, e.g. two versions
        // of the same feature) - its own "label" then renders as a smaller
        // subtitle right above that specific carousel. "subtitleOnly" lets a
        // later guide in the same group skip repeating the big heading.
        var headingHtml = "";
        if (g.groupLabel) headingHtml += '<div class="lp__label lp__label--guide">' + esc(g.groupLabel) + '</div>';
        // "sections" carousels (one carousel, several categories bundled in
        // order) get a subtitle that isn't fixed text - its content is set
        // and updated per-frame by initGuideCarousel as you page through.
        if (g.sections) {
          headingHtml += '<div class="carousel__subtitle" id="' + stageId + 'Sub"></div>';
        } else if (g.label) {
          headingHtml += (g.groupLabel || g.subtitleOnly)
            ? '<div class="carousel__subtitle">' + esc(g.label) + '</div>'
            : '<div class="lp__label lp__label--guide">' + esc(g.label) + '</div>';
        } else if (!g.groupLabel && !g.noLabel) {
          headingHtml += '<div class="lp__label lp__label--guide">The guide</div>';
        }
        // Optional pair of small subtitles sitting side by side right above
        // the image - e.g. a single image bundling two halves ("Color
        // palette" + "Typography") that each deserve their own label without
        // splitting the asset into two separate images.
        var subLabelsHtml = "";
        if (g.subLabels && g.subLabels.length === 2) {
          subLabelsHtml =
            '<div class="carousel__collabels">' +
              '<span class="carousel__subtitle">' + esc(g.subLabels[0]) + '</span>' +
              '<span class="carousel__subtitle">' + esc(g.subLabels[1]) + '</span>' +
            '</div>';
        }
        // Optional plain "video" slot - a single self-contained video (e.g. a
        // screen recording), same framed box as an image, no carousel/arrows.
        if (g.video) {
          return (
            headingHtml +
            '<div class="carousel__stage carousel__stage--side" id="' + stageId + '">' +
              '<span class="carousel__arrow" style="visibility:hidden" aria-hidden="true"></span>' +
              '<figure class="media--img carousel__figure"><video src="' + esc(g.video) + '"' + (g.autoplay ? ' autoplay muted loop playsinline' : PV(g.video) + ' controls playsinline') + '></video></figure>' +
              '<span class="carousel__arrow" style="visibility:hidden" aria-hidden="true"></span>' +
            '</div>'
          );
        }
        // Optional static "mockup" image shown above the pageable carousel -
        // same figure box treatment (incl. invisible arrow placeholders) so
        // it lines up exactly with the carousel below it.
        var mockupHtml = g.mockup
          ? '<div class="carousel__stage carousel__stage--side" id="' + stageId + 'Mock">' +
              '<span class="carousel__arrow" style="visibility:hidden" aria-hidden="true"></span>' +
              '<figure class="media--img carousel__figure"><img src="' + esc(g.mockup) + '" alt=""></figure>' +
              '<span class="carousel__arrow" style="visibility:hidden" aria-hidden="true"></span>' +
            '</div>'
          : '';
        // Optional "lpMock" - a laptop + phone device mockup instead of a plain
        // carousel, for a guide slot that's really a landing page. If there's
        // more than one web design (e.g. registration page + replay page),
        // clickable tabs above the mockup switch which one shows in the laptop.
        if (g.lpMock) {
          var mtabs = g.lpMock.tabs || [];
          var tabsHtml = mtabs.length > 1
            ? '<div class="carousel__tabs" id="' + stageId + 'Tabs">' +
                mtabs.map(function (t, ti) { return '<button class="ctab" data-i="' + ti + '">' + esc(t.label) + '</button>'; }).join("") +
              '</div>'
            : '';
          // Optional sticky "header" strip (e.g. just the logo row, cropped
          // from the real screenshot) pinned above the scrolling body, so the
          // logo stays visible the whole time you scroll - same pinned-strip
          // treatment used elsewhere (mock__nav--strip), just reusable per guide.
          var webHdrHtml = g.lpMock.header
            ? '<div class="mock__nav mock__nav--strip"><img src="' + esc(g.lpMock.header) + '" alt="Powtoon"></div>' : '';
          var mobHdrHtml = g.lpMock.mobileHeader
            ? '<div class="mock__nav mock__nav--strip mock__nav--strip-phone"><div class="mock__statusgap"></div><img src="' + esc(g.lpMock.mobileHeader) + '" alt="Powtoon"></div>' : '';
          // Optional per-instance screen sizing override, so a specific landing
          // page can show exactly down to a chosen point unscrolled without
          // touching the shared/global mockup size everywhere else. "webAspect"
          // keeps the laptop screen's real web proportions (e.g. a 1920×1080
          // design → "16 / 9") at whatever width it renders - height:auto lets
          // aspect-ratio drive the height instead of the fixed default.
          var webScreenStyle = g.lpMock.webAspect
            ? ' style="height:auto;aspect-ratio:' + g.lpMock.webAspect + '"'
            : (g.lpMock.webScreenHeight ? ' style="height:' + g.lpMock.webScreenHeight + 'px"' : "");
          var mobScreenStyle = g.lpMock.mobileScreenHeight ? ' style="height:' + g.lpMock.mobileScreenHeight + 'px"' : "";
          // Optional sub-labels sitting right above each device (e.g. "Landing
          // page web" above the laptop, "Landing page mobile" above the phone).
          var webLabelHtml = g.lpMock.webLabel ? '<div class="carousel__subtitle carousel__subtitle--web">' + esc(g.lpMock.webLabel) + '</div>' : "";
          var mobLabelHtml = g.lpMock.mobileLabel ? '<div class="carousel__subtitle carousel__subtitle--mobile">' + esc(g.lpMock.mobileLabel) + '</div>' : "";
          return (
            headingHtml +
            '<div class="lp__grid' + (g.lpMock.stacked ? ' lp__grid--stacked' : '') + '">' +
              webLabelHtml +
              tabsHtml +
              '<div class="mock mock--laptop">' +
                '<div class="mock__lid"><div class="mock__cam"></div>' +
                  '<div class="mock__screen" id="' + stageId + 'WebScreen"' + webScreenStyle + '>' + webHdrHtml + '<img id="' + stageId + 'Web" alt=""></div>' +
                '</div><div class="mock__base"></div>' +
              '</div>' +

        } else if (eg.chips && eg.chips.length) {

<script>
  /* PHONES - book / catalog carousels whose pages change shape (a cover, then

      var im = st.querySelector(".carousel__figure img"); if (!im) return;

<script>
  /* DESKTOP - the page count sits under its design and ends on the design's
     own right edge (not the column's), whatever the design's width. */
  (function () {
    var mq = window.matchMedia("(min-width: 721px)");
    function drawn(el) {
      var r = el.getBoundingClientRect();
      if (el.tagName === "IMG" && el.naturalWidth && /contain|scale-down/.test(getComputedStyle(el).objectFit)) {
        var s = Math.min(r.width / el.naturalWidth, r.height / el.naturalHeight), w = el.naturalWidth * s;
        var px = parseFloat((getComputedStyle(el).objectPosition || "50%").split(" ")[0]) / 100; if (isNaN(px)) px = .5;

    }
    function stageOf(meta) {
      var st = meta.previousElementSibling;
      while (st && !(st.classList && st.classList.contains("carousel__stage"))) st = st.previousElementSibling;
      return st;
    }
    function align() {
      Array.prototype.forEach.call(document.querySelectorAll(".carousel__meta .pg"), function (pg) {
        pg.style.transform = "";

        var meta = pg.closest(".carousel__meta"), st = meta && stageOf(meta); if (!st || !meta.offsetParent) return;
        var sr = st.getBoundingClientRect(), R = -1e9;
        Array.prototype.forEach.call(st.querySelectorAll("img, video, iframe, canvas, .mock"), function (el) {

          var cx = (r.left + r.right) / 2; if (cx < sr.left || cx > sr.right) return;
          var hid = false; for (var p = el.parentElement; p && p !== st; p = p.parentElement) { var pc = getComputedStyle(p); if (pc.display === "none" || pc.visibility === "hidden" || +pc.opacity < .5) { hid = true; break; } }

</script>
<script>
  /* phone menu */
  (function () {

        scrim = document.getElementById("navScrim"), close = document.getElementById("navClose");
    if (!menu || !burger) return;
    function setMenu(open) {
      menu.classList.toggle("is-open", open); if (scrim) scrim.classList.toggle("is-open", open);
      menu.setAttribute("aria-hidden", open ? "false" : "true"); burger.setAttribute("aria-expanded", open ? "true" : "false");
      burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      document.body.classList.toggle("menu-open", open);
    }
    burger.addEventListener("click", function () { setMenu(!menu.classList.contains("is-open")); });
    if (close) close.addEventListener("click", function () { setMenu(false); });
    if (scrim) scrim.addEventListener("click", function () { setMenu(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false); });
